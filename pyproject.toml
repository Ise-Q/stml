[project]
name = "stml"
version = "0.1.0"
# Tested on 3.10–3.12. The codebase uses no 3.12-only syntax; the lower bound
# is set so a grader on a stable distro (Ubuntu 22.04, macOS Sonoma stock
# python, conda base) can install without compiling Python from source.
requires-python = ">=3.10"
dependencies = [
    "arch>=6.0",
    "hmmlearn>=0.3.0",
    "ipykernel>=6.0",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "optuna>=3.4",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "tqdm>=4.66",
    "xgboost>=2.0",
]

[project.optional-dependencies]
# Optional extras for Harry's branch. Install with:
#   uv sync --extra harry-features
# Currently only the wavelet module needs an extra wheel; TDA (ripser) is
# deferred. See reports/harry/SETUP.md.
harry-features = ["pywavelets>=1.4"]
# Sreeram_experimental S4 multi-task neural network (plan §3.1 Family B).
# Kept out of the base install because the pytorch-cpu wheels are not built for
# macOS x86_64 past 2.2; the macOS user installs from the PyPI default index
# with `uv sync --extra multitask` once S4 is reached. The base build of
# S0/S1/S2/S3 + S6/S7 does not depend on torch.
multitask = ["torch>=2.2.0,<2.3"]
# Sreeram_experimental S5 cluster importance (plan §3.6).
# shap pulls numba/llvmlite which need either a binary wheel for the platform
# (some macOS x86_64 builds fail without LLVM toolchain) or a working compile.
# Kept optional so the rest of the pipeline can build cleanly; install with
# `uv sync --extra importance` when S5 is reached.
importance = ["shap>=0.46.0", "numba>=0.60", "llvmlite>=0.43"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (GARCH fits etc.); run with `pytest -m slow`",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.5.7",
    "nbstripout>=0.9.1",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]
# Optional: external exchange calendars used only as a cross-check in
# stml.na_checks. The hand-coded tables are authoritative, so these are not
# required to run the notebook or the diagnostics. Install with:
#   uv sync --group calendars
calendars = [
    "pandas-market-calendars>=5.0",
    "exchange-calendars>=4.0",
    "holidays>=0.40",
]
# Optional: third-party libraries required only by two fitted/engineered
# feature families ported from teammate branches:
#   * F13 wavelet multiscale energy  -> pywavelets   (Harry)
#   * F17 HMM regime posteriors       -> hmmlearn      (Sreeram)
# The full feature matrix build (stml.metamodel.build_features) needs these.
# Install with:
#   uv sync --group features-extra
features-extra = [
    "pywavelets>=1.4",
    "hmmlearn>=0.3.0",
]
